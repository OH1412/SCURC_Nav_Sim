/**:
  ros__parameters:
    # YOLOv8模型参数
    weight_path: "best.pt"  # 模型权重文件路径
    conf: 0.5                  # 置信度阈值
    visualize: false            # 是否显示可视化窗口
    
    # ROS话题参数
    image_topic: "/camera/camera/color/image_raw"  # 输入图像话题
    pub_topic: "/yolov8/BoundingBoxes"      # 输出边界框话题
    
    # 相机参数
    camera_frame: "camera_color_optical_frame"  # 相机坐标系名称
    
    # 硬件参数
    use_cpu: false  # 是否使用CPU进行推理（true表示使用CPU，false表示使用GPU）
    weapon_enabled: false
    weapon_weight_path: ""
    weapon_conf: 0.6

/kfs_weapon_3d_grasp:
  ros__parameters:
    boxes_topic: "/yolov8/BoundingBoxes"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/aligned_depth_to_color/camera_info"
    base_frame: "base_link"
    kfs_top_offset: 5
    kfs_roi_half_size: 3
    kfs_z_offset: 0.0
    weapon_roi_half_size: 3
    weapon_z_offset: 0.0
    max_depth: 3.0

/red_pole_alignment:
  ros__parameters:
    # 图像话题
    image_topic: "/camera/camera/color/image_raw"
    visualize: true
    
    # 十字准星位置（相对于图像中心的偏移，单位：像素）
    crosshair_offset_x: 0    # 正值向右，负值向左
    crosshair_offset_y: 50   # 正值向下，负值向上
    crosshair_size: 30       # 十字大小
    crosshair_thickness: 2   # 十字线宽
    
    # 红色HSV阈值范围1（0-10度）
    hsv_lower1_h: 0
    hsv_lower1_s: 100
    hsv_lower1_v: 100
    hsv_upper1_h: 10
    hsv_upper1_s: 255
    hsv_upper1_v: 255
    
    # 红色HSV阈值范围2（160-180度）
    hsv_lower2_h: 160
    hsv_lower2_s: 100
    hsv_lower2_v: 100
    hsv_upper2_h: 180
    hsv_upper2_s: 255
    hsv_upper2_v: 255
    
    # 杆检测参数
    min_pole_area: 500       # 最小面积阈值
    min_aspect_ratio: 2.0    # 最小长宽比
    max_pole_width: 100      # 最大杆宽度（像素）
    
    # 对准控制参数
    alignment_tolerance: 20  # 对准容差（像素）
    control_gain: 0.002      # 控制增益
    max_angular_vel: 0.5     # 最大角速度
    
    # 串口通信参数
    serial_port: "/dev/ttyUSB0"  # 串口设备路径
    serial_baudrate: 115200      # 波特率
    serial_enabled: true         # 是否启用串口发送
    serial_frame_header: 0xA5    # 数据帧头
    serial_frame_tail: 0x5A      # 数据帧尾
