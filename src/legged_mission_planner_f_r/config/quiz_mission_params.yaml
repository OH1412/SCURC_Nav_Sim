include_quiz_state: true
start_state: 0

quiz_result_topic: /mission/quiz_type
quiz_result_type: std_msgs/msg/Int32
quiz_wait_timeout_s: 30.0

ui_points:
  file: ui_points_fast_mode.yaml

label_hotspots:
  file: label_hotspots.yaml

base_scenario_file: tmp/base_scenario.yaml

# 基础规划完成（仅预览/导出，不触发 BT 转换）
base_plan_ready_topic: /mission/base_plan_ready
base_plan_ready_type: std_msgs/msg/Bool

# 二次规划完成（收到 quiz 或超时后，触发 quintuple_loader）
quiz_plan_ready_topic: /mission/quiz_plan_ready
quiz_plan_ready_type: std_msgs/msg/Bool

# 手动规划 GUI 使用（base_plan / mission_plan UI）
plan_ready_topic: /mission/plan_ready
plan_ready_type: std_msgs/msg/Bool

planner_variant: front_back
max_waypoint: 4

ranking:
  prefer_direct_path_weight: 10.0
  cross_path_penalty: 5.0
  path_change_penalty: 1.0
