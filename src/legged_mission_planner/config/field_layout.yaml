# UI path-diagram geometry only (NOT exported Nav2 poses).
# Used by mission_ui to draw logical path/wp lines on 场地俯视图.png.
# Map coordinates, pick/place offsets, and arm positions belong in legged_bringup.

# Field diagram convention (for visualization):
#   x: distance from the 6m field lower boundary (0 -> 6m)
#   y: from right wall toward left wall (0 -> 4m)

paths:
  1: {y: 0.30, label: right_edge, from_left_cm: 370}
  2: {y: 1.15, label: right_inner, from_left_cm: 285}
  3: {y: 2.00, label: center, from_left_cm: 200}
  4: {y: 2.85, label: left_inner, from_left_cm: 115}
  5: {y: 3.70, label: left_edge, from_left_cm: 30}

waypoint_rows:
  1: {x: 1.00, role: entry}
  2: {x: 1.625, role: lower_pick}
  3: {x: 2.475, role: upper_pick}
  4: {x: 4.00, role: transit_after_bump}
  5: {x: 5.00, role: place}

# Deprecated: reserved for bringup migration reference (not used by export).
frame:
  id: map
  local_origin_in_map: [0.0, 0.0, 0.0]
  fixed_yaw: 0.0
waypoint_overrides: {}
box_slots: {}
placement_zones: {}
pick_offsets:
  left: {dx: 0.0, dy: 0.0}
  right: {dx: 0.0, dy: 0.0}
place_offsets:
  left: {dx: 0.0, dy: 0.0}
  right: {dx: 0.0, dy: 0.0}
