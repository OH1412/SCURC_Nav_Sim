/**:
  ros__parameters:
    locate_in_prior_map: false     # false = 建图模式, true = 重定位模式（持续输出与先验地图对齐后的里程计/位姿）
    prior_map_path: "../maps/test.pcd"

    common:
      odom_frame_id: "odom"          # 父帧：odom
      base_frame_id: "base_link"     # 子帧：base_link
      sensor_frame_id: "sensor"      # 传感器帧：sensor（需提前发布sensor→base_link的静态TF）
      send_odom_base_tf: true        # 开启odom→base_link发布（false则发布odom→sensor）
      img_topic: "/left_camera/image"
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
      time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
      img_en: 0
      lidar_en: 1
      ros_driver_bug_fix: true

    extrin_calib:
      extrinsic_T: [0.0, 0.0, 0.0]
      extrinsic_R: [1., 0., 0.,
                    0., 1., 0.,
                    0., 0., 1.]
      # Rcl: [0.0453694, -0.998764, -0.020299,
      #       0.0390085,  0.0220757, -0.998995,
      #       0.998208,   0.044532,   0.0399619]
      # Pcl: [-0.110736, -0.118778, -0.106997]

    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.02
      lidar_type: 1 # Livox Avia LiDAR
      scan_line: 4
      blind: 0.5
      scan_rate: 10

    # vio:
    #   max_iterations: 5
    #   outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
    #   img_point_cov: 100 # 100 1000
    #   patch_size: 8
    #   patch_pyrimid_level: 4
    #   normal_en: false
    #   raycast_en: false
    #   inverse_composition_en: false
    #   exposure_estimate_en: false
    #   inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.8 # 0.2
      gyr_cov: 0.5 # 0.5
      b_acc_cov: 0.001 # 0.1
      b_gyr_cov: 0.001 # 0.1

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.15
      min_eigen_value: 0.005 # 0.005
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: true

    publish:
      initial_frame_id: "odom"  # 替换原 "camera_init"
      odom_frame_id: "base_link"      # 替换原 "aft_mapped"
      dense_map_en: true
      pub_effect_point_en: true
      pub_plane_en: true
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "CBD_Building_01"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      colmap_output_en: false # need to set interval = -1
      filter_size_pcd: 0.15
      interval: -1

    