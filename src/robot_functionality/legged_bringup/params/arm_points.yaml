# 十八个机械臂标定点 — map/init 坐标系（与 /aft_mapped_to_init 同一固定系）
#
# 编号 0~7,16 ：抓取（role: pick）
# 编号 8~15,17：放置（role: place）
#
# 每个点位只存 map_target：物体/抓取点在 map/init 系下的固定位姿
#   x, y, z   — 米
#   yaw       — 弧度
#
# 运行时 arm_pose_broadcaster：
#   1. 读 /aft_mapped_to_init（aft_mapped 在 init 系位姿）
#   2. 叠加静态 TF aft_mapped→base_link（见 static_tf_params.yaml t1）
#   3. 将 map_target 变换到当前 base_link，再转 arm_root（mm, rad）
#      arm_root 原点在 base_link 下 (-9.73, 0.04, 190.68) mm，无旋转
#   4. 吸盘几何优化 XY：容差圆 R=12.5cm、吸盘中心≤665mm（arm_root 原点为圆心）
#
# 可选 arm_root_target / base_link_target：无定位时回退（base_link 会自动转 arm_root）
#
# 机制说明：legged_bringup/docs/arm_pose_broadcaster.md

