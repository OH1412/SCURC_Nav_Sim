#       enabled: True  # 启用插件

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20          # 反馈发布频率（20Hz，与原配置一致）
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 5.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [2.0, 1.4, 1.2]
    min_velocity: [-2.0, -1.4, -1.2]
    max_accel: [12.0, 6.0, 20.0]
    max_decel: [-12.0, -6.0, -20.0]
    odom_topic: "state_estimation"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ═══════════════════════════════════════════════════════════════
# Custom node parameters (from bringup_in_real.launch.py / navigation.launch.py)
# 这些不是 Nav2 原生节点，而是项目自定义节点。集中管理便于调参。
# ═══════════════════════════════════════════════════════════════

# 区域切换器：根据机器人 x 坐标动态切换 DWB critic 参数
# 注意：代码默认值 lower=1.35, upper=4.0，launch 文件覆盖同值
position_based_param_switcher:
  ros__parameters:
    lower_boundary: 1.35         # 中间区下边界 (x<1.35 → 边缘区，允许旋转和横向移动)
    upper_boundary: 4.0          # 中间区上边界 (x>4.0 → 边缘区，允许旋转和横向移动)
    hysteresis_margin: 0.1       # 迟滞边界 (±0.1m)，防止在边界附近来回振荡
    odom_topic: "state_estimation"
    target_node: "controller_server"

# 障碍物尺度控制器：当致命障碍物侵入机器人 footprint 时降低 ObstacleFootprint.scale
obstacle_scale_controller:
  ros__parameters:
    target_node: "controller_server"
    costmap_topic: "/local_costmap/costmap"
    hysteresis_count: 5           # 连续 N 次检测到障碍物后才触发切换，防抖
    normal_scale: 20.0            # 无障碍物时 ObstacleFootprint.scale 恢复正常值
    push_through_scale: 0.01      # 障碍物侵入时降为 0.01，基本禁用 footprint 代价，硬挤过去

# UDP 速度桥接：将 Nav2 的 /cmd_vel 通过 UDP 转发给 deploy_cpp（机器人底盘）
cmd_vel_udp_bridge:
  ros__parameters:
    udp_ip: "127.0.0.1"
    udp_port: 9870
    mode: 2
    cmd_vel_topic: "/cmd_vel"
    use_twist_stamped: false
    estop_topic: ""
    # deploy 速度量纲上限 (标定 /robot_cmd 记录: vx±2.0 vy±1.4 wz±1.2)
    cmd_vx_min: -2.0
    cmd_vx_max: 2.0
    cmd_vy_min: -1.4
    cmd_vy_max: 1.4
    cmd_yaw_min: -1.2
    cmd_yaw_max: 1.2
    # step 死区补偿 (标定: velocity_calibration_20260705_022941.csv)
    deadzone_vx: 0.45
    deadzone_vy: 0.43
    deadzone_wz: 0.85
    min_effective_vx: 0.5
    min_effective_vy: 0.5
    min_effective_wz: 0.9

# 机械臂控制服务器（可选，enable_arm_control=true 时启用）
arm_control_server:
  ros__parameters:
    arm_timeout: 30.0             # 机械臂动作超时时间 (秒)
    enable_serial_publish: true
    arm_command_topic: "/arm_command"
    arm_status_topic: "/arm_status"
    arm_action: 1                 # 默认动作: 1=Pick(吸取), 2=Place(放置)

# 机械臂抓取使命触发器（可选，enable_waypoint_mission=true 时启用）
arm_mission_trigger:
  ros__parameters:
    startup_delay: 0.0            # TimerAction 已做延迟，此处额外延迟为 0
    action_timeout: 30.0          # 机械臂抓取动作超时 (秒)

# 起立命令发送器
stand_up_sender:
  ros__parameters:
    reloc_delay: 0.0              # 重定位完成后额外等待时间 (秒)，0=不等待

# 启动时序参数（launch 文件中的 TimerAction delay 值汇总）
bringup_timing:
  ros__parameters:
    start_delay: 5.0              # Livox 启动后等待多久启动 bringup (秒)
    stand_up_delay: 3.0           # bringup 启动后等待多久发送起立命令 (秒)
    waypoint_start_delay: 25.0    # bringup 启动后等待多久触发机械臂使命 (秒)
    arm_control_delay: 12.0       # bringup 启动后等待多久启动机械臂控制服务器 (秒)