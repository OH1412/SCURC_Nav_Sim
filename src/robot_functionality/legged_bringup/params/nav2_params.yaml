controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.1
    failure_tolerance: 0.3
    odom_topic: "state_estimation"
    transform_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0
    # Goal checker parameters
    general_goal_checker:
      stateful: False
      plugin: "behavior_ext_plugins::SimpleGoalCheckerXY"
      # xy_goal_tolerance: 0.10             # 兜底值（未设置 x/y 时默认使用此值）
      x_goal_tolerance: 0.08                # x 方向独立容差 (m)
      y_goal_tolerance: 0.15                # y 方向独立容差 (m)
      # yaw_goal_tolerance: 6.28             # 中间区=6.28(360°) | 边缘区=0.17453(10°)
      yaw_goal_tolerance: 0.5236             # 边缘区=0.5236(30°) | 中间区由 switcher 切为 6.28
    FollowPath:    
      # plugin: "nav2_mppi_controller::MPPIControllerExt"
      # #param 
      # adjustThre: 10.0
      # minAngleDiff: 360.0
      # adjustHeadingSpeed: 0.2
      # # 
      # time_steps: 56 # prediction horizon = time_steps x model_dt = 3s
      # model_dt: 0.05 # =1/controller_frequency
      # batch_size: 2000 # Count of randomly sampled candidate trajectories from current optimal control sequence in a given iteration. 1000 @ 50 Hz or 2000 @ 30 Hz seems to produce good results.
      # vx_std: 0.3 # prediction horizon x vx_std = 3m -->local costmap dim should larger than 3x2=6m
      # vy_std: 0.3
      # wz_std: 0.1
      # vx_max: 0.5
      # vx_min: -0.5
      # vy_max: 0.5
      # wz_max: 0.1
      # iteration_count: 1 # Recommended to remain as 1 and instead prefer larger batch sizes.
      # prune_distance: 3.0
      # transform_tolerance: 0.1
      # temperature: 0.3 # 0 mean use control with best cost, huge value will lead to just taking mean of all trajectories without cost consideration.
      # gamma: 0.065 # A trade-off between smoothness (high) and low energy (low). This is a complex parameter that likely won’t need to be changed from the default.
      # motion_model: "Omni"
      # visualize: false # set to true to visualize the trajectories, but it will slow down the computation by a lot
      # reset_period: 1.0 # Required time of inactivity to reset optimizer (only in Humble
      # regenerate_noises: false
      # retry_attempt_limit: 3 # Number of attempts to find feasible trajectory on failure for soft-resets before reporting total failure.
      # TrajectoryVisualizer:
      #   trajectory_step: 5
      #   time_step: 3
      # # AckermannConstraints:
      # #   min_turning_r: 0.2
      # critics: ["ObstaclesCritic","GoalCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic","TwirlingCritic"]
      # GoalCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 5.0
      #   threshold_to_consider: 0.2
      # PreferForwardCritic: # moving in the forward direction, rather than reversing.
      #   enabled: false
      #   cost_power: 1
      #   cost_weight: 5.0
      #   threshold_to_consider: 0.5 # Distance (m) between robot and goal to stop considering preferring forward and allow goal critics to take over.
      # ObstaclesCritic: # 如果容易撞到低矮的障碍物，检查地形分析是否正确然后再调整这个参数
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 0.4 # Higher radii should correspond to reduced repulsion_weight due to the penalty formation (e.g. inflation_radius - min_dist_to_obstacle). 
      #   critical_weight: 10.0 # #? proprtional to your inflation layer’s radius. Higher radii should correspond to reduced repulsion_weight due to the penalty formation (e.g. inflation_radius - min_dist_to_obstacle).
      #   consider_footprint: false # switch on this can increase computation cost
      #   collision_cost: 10.0
      #   collision_margin_distance: 0.1 # 0.05 # Margin distance (m) from collision to apply severe penalty, similar to footprint inflation. Between 0.05-0.2 is reasonable. Note that it will highly influence the controller not to enter spaces more confined than this, so ensure this parameter is set lower than the narrowest you expect the robot to need to traverse through.
      #   near_goal_distance: 0.1 # if the robot is within this distance of the goal, it will not be repelled by obstacles.
      #   inflation_radius: 5.0 # Radius to inflate costmap around lethal obstacles. This should be the same as for your inflation layer (Humble only)
      #   cost_scaling_factor: 3.0 # Exponential decay factor across inflation radius. This should be the same as for your inflation layer (Humble only)
      #   inflation_layer_name: ["local_inflation_layer"] # ,"global_inflation_layer"
      # PathAlignCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 14.0
      #   max_path_occupancy_ratio: 0.05
      #   trajectory_point_step: 3
      #   threshold_to_consider: 0.5 # Distance (m) between robot and goal to stop considering path alignment and allow goal critics to take over. Should be set to a value slightly larger than your robot’s footprint radius.
      #   # TODO: what is the value of path_resolution? 0.2 maybe?
      #   offset_from_furthest: 13 # number of path points a trajectory passes through while tracking the path
      #   # prediction_horizon_s * max_speed / path_resolution / 3.0 is a good baseline.
      #   # 3 * 2.5 / 0.2 / 3.0 =
      #   use_path_orientations: false
      # PathFollowCritic: # incentivizes making progress along the path
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 5.0
      #   offset_from_furthest: 5
      #   threshold_to_consider: 0.1 #That is to say, path following will be considered until the robot is within this distance of the goal, at which point the goal critic will take over.
      # PathAngleCritic: # This critic penalizes trajectories at a high relative angle to the path. This helps the robot make sharp turns when necessary due to large accumulated angular errors.
      #   enabled: false
      #   cost_power: 1
      #   cost_weight: 2.0
      #   offset_from_furthest: 4
      #   threshold_to_consider: 0.5
      #   max_angle_to_furthest: 1.0
      #   mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0
      # plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # desired_linear_vel: 0.5
      # lookahead_dist: 0.6
      # min_lookahead_dist: 0.3
      # max_lookahead_dist: 0.9
      # lookahead_time: 1.5
      # rotate_to_heading_angular_vel: 1.8
      # transform_tolerance: 0.1
      # use_velocity_scaled_lookahead_dist: false
      # min_approach_linear_velocity: 0.05
      # approach_velocity_scaling_dist: 0.6
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 1.0
      # use_regulated_linear_velocity_scaling: true
      # use_fixed_curvature_lookahead: false
      # curvature_lookahead_dist: 0.25
      # use_cost_regulated_linear_velocity_scaling: false
      # regulated_linear_scaling_min_radius: 0.9
      # regulated_linear_scaling_min_speed: 0.25
      # use_rotate_to_heading: false
      # allow_reversing: true
      # rotate_to_heading_min_angle: 0.785
      # max_angular_accel: 3.2
      # max_robot_pose_search_dist: 10.0
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: -2.0
      min_vel_y: -1.4
      max_vel_x: 2.0
      max_vel_y: 1.4
      max_vel_theta: 1.2
      min_speed_xy: 0.3
      max_speed_xy: 3.0
      min_speed_theta: -1.2
      acc_lim_x: 12.0
      acc_lim_y: 6.0
      acc_lim_theta: 20.0
      decel_lim_x: -12.0
      decel_lim_y: -6.0
      decel_lim_theta: -20.0
      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 10
      sim_time: 0.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.30             # 兜底（未设 x/y 时 RotateToGoalXY 使用）
      x_goal_tolerance: 0.08              # 与 general_goal_checker 一致
      y_goal_tolerance: 0.15
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ═══════════════════════════════════════════════════════════════
      # 方案C：所有 8 个 critic 预加载，运行时 param set 切换
      # 当前默认 = 中间区 (yaw锁0，禁止旋转)
      # 切边缘区 = 注释中间区值，取消边缘区值注释，重启 switcher
      # ═══════════════════════════════════════════════════════════════
      critics: ["dwb_yaw_constraint::RotateToGoalXY", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "dwb_yaw_constraint::MaintainYawCritic", "dwb_yaw_constraint::DecouplingCritic"]
      # --- 共有参数（两区相同）---
      ObstacleFootprint.scale: 20.0
      PathDist.scale: 32.0
      GoalDist.scale: 16.0
      # ═══════════════════════════════════════════════════════════════
      # 默认中间区 (yaw锁0，禁止旋转) — 安全fallback
      # 运行时由 position_based_param_switcher 动态切换
      # ═══════════════════════════════════════════════════════════════
      # --- 旋转 critic（矩形 x/y 窗口，配套 SimpleGoalCheckerXY）---
      "dwb_yaw_constraint::RotateToGoalXY.scale": 0.0           # 中间区=0.0 | 边缘区=32.0
      "dwb_yaw_constraint::RotateToGoalXY.slowing_factor": 5.0
      "dwb_yaw_constraint::RotateToGoalXY.lookahead_time": -1.0
      GoalAlign.scale: 0.0              # 中间区=0.0 | 边缘区=24.0
      GoalAlign.forward_point_distance: 0.1
      PathAlign.scale: 0.0              # 中间区=0.0 | 边缘区=32.0
      PathAlign.forward_point_distance: 0.1
      # --- yaw 锁定 critic ---
      "dwb_yaw_constraint::MaintainYawCritic.scale": 5000.0   # 中间区=5000 | 边缘区=0.0
      "dwb_yaw_constraint::MaintainYawCritic.desired_yaw": 0.0
      "dwb_yaw_constraint::MaintainYawCritic.reference_frame": "map"
      # --- 解耦 critic (中间区禁用) ---
      "dwb_yaw_constraint::DecouplingCritic.scale": 0.0       # 中间区=0.0 | 边缘区=30.0
      "dwb_yaw_constraint::DecouplingCritic.max_vx": 2.0
      "dwb_yaw_constraint::DecouplingCritic.max_vy": 1.4
      "dwb_yaw_constraint::DecouplingCritic.max_vtheta": 1.2
      # ═══════════════════════════════════════════════════════════════
      # 边缘区 (解除yaw限制，允许旋转)
      # 由 position_based_param_switcher 动态设置
      # ═══════════════════════════════════════════════════════════════
      # # --- 旋转 critic ---
      # RotateToGoal.scale: 32.0           # 中间区=0.0 | 边缘区=32.0
      # RotateToGoal.slowing_factor: 5.0
      # RotateToGoal.lookahead_time: -1.0
      # GoalAlign.scale: 24.0              # 中间区=0.0 | 边缘区=24.0
      # GoalAlign.forward_point_distance: 0.1
      # PathAlign.scale: 32.0              # 中间区=0.0 | 边缘区=32.0
      # PathAlign.forward_point_distance: 0.1
      # # --- yaw 锁定 critic ---
      # "dwb_yaw_constraint::MaintainYawCritic.scale": 0.0   # 中间区=5000 | 边缘区=0.0
      # "dwb_yaw_constraint::MaintainYawCritic.desired_yaw": 0.0
      # "dwb_yaw_constraint::MaintainYawCritic.reference_frame": "map"
      # # --- 解耦 critic (边缘区启用) ---
      # "dwb_yaw_constraint::DecouplingCritic.scale": 30.0       # 中间区=0.0 | 边缘区=30.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.2971, 0.19185], [0.2971, -0.19185], [-0.44518, -0.19185], [-0.44518, 0.19185]]"
      # 这里有一个隐患就是绝对禁止通行是根据footprint的内切圆0.2971m来计算的，但是后腿是0.44518m，虽然我设置了膨胀体积是外切圆0.6m，但可能还是有危险。
      plugins: ["static_layer", "local_obstacle_layer", "local_inflation_layer"]
      # 这里可以加入traversability_grid_map_layer来处理地形代价地图
      # plugins: ["local_obstacle_layer", "local_inflation_layer", "traversability_grid_map_layer"] # 添加你的层

      # traversability_grid_map_layer:
      #   plugin: "grid_map_costmap_2d::GridMapCostmap2D"
      #   grid_map_topic: "/elevation_mapping/elevation_map_raw"
      #   map_layer_name: "traversability"
      #   # 原始数据范围（0.0 到 1.0）
      #   data_min: 0.0
      #   data_max: 1.0
      #   # 成本值映射：将 traversability 值 (1.0=安全) 映射到 Costmap (0=安全)
      #   cost_map_mode: "INVERTED_COST_TO_OCCUPANCY" # 使用反转模式

      #   # 阈值设置：确保低可通行度区域被视为致命障碍 (254)
      #   fatal_cost_threshold: 0.2 # 可通行度低于 0.2 的区域被视为致命障碍
      #   unknown_cost_value: 255
      local_inflation_layer:
        # 局部代价地图的膨胀层：静态层只需要标记黑色障碍物为致命代价，
        # 膨胀体积设置极小（0.05m = 1个栅格），主要由 footprint 来保证安全距离。
        # 动态障碍物的避让依赖 DWB 的 ObstacleFootprint critic。
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.01
      local_obstacle_layer:
        plugin: "costmap_intensity::ObstacleLayerIntensity"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_intensity: 2.0
        min_obstacle_intensity: 0.2
        observation_sources: pointcloud
        pointcloud:  # no frame set, uses frame from message
          topic: /terrain_map
          max_obstacle_height: 0.5
          min_obstacle_height: -0.5
          obstacle_max_range: 4.5
          obstacle_min_range: 0.2
          raytrace_max_range: 4.5
          raytrace_min_range: 0.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
      static_layer:
        plugin: "costmap_intensity::StaticLayerNonLethal"
        map_subscribe_transient_local: True
        occupied_cost_value: 200
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.2971, 0.19185], [0.2971, -0.19185], [-0.44518, -0.19185], [-0.44518, 0.19185]]"
      resolution: 0.1
      track_unknown_space: true
      plugins: ["static_layer", "global_inflation_layer"] # "global_obstacle_layer", 
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      global_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True
      # global_obstacle_layer:
      #   plugin: "costmap_intensity::ObstacleLayerIntensity"
      #   enabled: True
      #   footprint_clearing_enabled: True
      #   max_obstacle_intensity: 2.0
