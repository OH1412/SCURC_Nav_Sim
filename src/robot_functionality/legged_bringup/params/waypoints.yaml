  # - x: 5.25
  #   y: 0.0
  #   yaw: 0.0
  - x: 1.35
    y: 0.0
    yaw: 0.0
  - x: 1.925
    y: 0.0
    yaw: 0.0
  - x: 5.25
    y: 0.0
    yaw: 0.0
